name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PNPM Setup
        uses: pnpm/setup@v3
        with:
          node-version-file: false
          runtime: node@lts
          cache: true

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: "chore: release package(s)"
          commit-message: "chore: release package(s)"
          publish-script: pnpm changeset publish
